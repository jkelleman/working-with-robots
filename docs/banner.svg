<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Working With Robots: Designing a Fulfillment Pick Station">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="#0b0e11"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- copy -->
  <g font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace">
    <circle cx="70" cy="104" r="6" fill="#1f9d55"/>
    <circle cx="70" cy="104" r="11" fill="none" stroke="#1f9d55" stroke-opacity=".3" stroke-width="4"/>
    <text x="90" y="110" font-size="17" letter-spacing="3.5" fill="#9aa5af">DESIGN CONCEPT</text>
    <text x="64" y="232" font-size="20" letter-spacing="4" fill="#9aa5af">DESIGNING A FULFILLMENT PICK STATION</text>
    <text x="64" y="318" font-size="15" letter-spacing="1.5" fill="#6b7680">STATE MACHINE · MULTIMODAL SIGNALS · EXCEPTION RECOVERY</text>
  </g>
  <text x="62" y="190" font-family="'IBM Plex Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="66" font-weight="600" letter-spacing="-2" fill="#e8ecef">Working With Robots</text>
  <rect x="64" y="262" width="56" height="2" fill="#e8ecef"/>

  <!-- scene -->
  <g transform="translate(790 70)">
    <!-- floor -->
    <rect x="0" y="262" width="430" height="3" rx="1.5" fill="#3a424a"/>
    <!-- pod on drive unit -->
    <g transform="translate(20 40)">
      <rect x="0" y="0" width="170" height="170" rx="6" fill="#1b2127" stroke="#4a5560" stroke-width="2"/>
      <g fill="#2a3138">
        <rect x="10" y="10" width="33" height="33" rx="2"/><rect x="49" y="10" width="33" height="33" rx="2"/><rect x="88" y="10" width="33" height="33" rx="2"/><rect x="127" y="10" width="33" height="33" rx="2"/>
        <rect x="10" y="49" width="33" height="33" rx="2"/><rect x="49" y="49" width="33" height="33" rx="2"/><rect x="127" y="49" width="33" height="33" rx="2"/>
        <rect x="10" y="88" width="33" height="33" rx="2"/><rect x="49" y="88" width="33" height="33" rx="2"/><rect x="88" y="88" width="33" height="33" rx="2"/><rect x="127" y="88" width="33" height="33" rx="2"/>
        <rect x="10" y="127" width="33" height="33" rx="2"/><rect x="49" y="127" width="33" height="33" rx="2"/><rect x="88" y="127" width="33" height="33" rx="2"/><rect x="127" y="127" width="33" height="33" rx="2"/>
      </g>
      <rect x="88" y="49" width="33" height="33" rx="2" fill="#1f9d55"/>
      <rect x="84" y="45" width="41" height="41" rx="4" fill="none" stroke="#1f9d55" stroke-opacity=".35" stroke-width="3"/>
      <rect x="8" y="178" width="154" height="34" rx="12" fill="#4a5560"/>
      <circle cx="40" cy="214" r="7" fill="#0b0e11"/><circle cx="130" cy="214" r="7" fill="#0b0e11"/>
      <circle cx="30" cy="195" r="4" fill="none" stroke="#9aa5af" stroke-width="2"/>
      <path d="M-16 196h12M-22 206h16" stroke="#4a5560" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- guidance arc -->
    <path d="M146 105 C 210 40, 270 40, 318 78" fill="none" stroke="#1f9d55" stroke-width="2.5" stroke-dasharray="4 7" stroke-linecap="round"/>
    <!-- stack light -->
    <g transform="translate(250 60)">
      <rect x="0" y="0" width="24" height="18" rx="3" fill="#2a3138"/>
      <rect x="0" y="21" width="24" height="18" rx="3" fill="#2a3138"/>
      <rect x="0" y="42" width="24" height="18" rx="3" fill="#1f9d55"/>
      <rect x="0" y="63" width="24" height="18" rx="3" fill="#2a3138"/>
      <rect x="9" y="81" width="6" height="121" fill="#4a5560"/>
    </g>
    <!-- associate -->
    <g transform="translate(330 70)">
      <circle cx="26" cy="16" r="16" fill="#c3ccd5"/>
      <rect x="6" y="38" width="40" height="80" rx="16" fill="#8a96a3"/>
      <path d="M8 56 L -40 46" stroke="#8a96a3" stroke-width="12" stroke-linecap="round"/>
      <circle cx="-42" cy="46" r="7" fill="#c3ccd5"/>
      <rect x="10" y="114" width="14" height="78" rx="6" fill="#4a5560"/>
      <rect x="28" y="114" width="14" height="78" rx="6" fill="#4a5560"/>
